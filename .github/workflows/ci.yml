# 牛马修仙传 CI — clone-to-green 质量门(V5.9-N.11+)
# 范围:类型检查 + 全量单元/集成测试 + 内容校验。
# Cocos/Electron 打包需要本机 Cocos Creator 3.8.4,不在 CI 范围内(见 scripts/build-web.cjs)。
name: CI

on:
  push:
    branches: [gameplay-v2, main]
  pull_request:
    branches: [gameplay-v2, main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm install --no-audit --no-fund

      # pretest 钩子(scripts/ensure-desktop-deps.cjs)会自动补装 desktop/ 依赖
      - name: Full test suite (typecheck + 158 files)
        run: npm test

      - name: Content integrity check
        run: npm run content:check

      - name: Gameplay v2 static checks
        run: npm run gameplay-v2:check
